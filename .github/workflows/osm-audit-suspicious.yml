name: Seconde vérification OSM des points suspects.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/osm-audit-suspicious.mjs'
      - '.github/workflows/osm-audit-suspicious.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Vérifier via OpenStreetMap Nominatim.
        run: node scripts/osm-audit-suspicious.mjs
      - name: Enregistrer le rapport.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/osm-audit-suspicious.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ajouter la seconde verification OSM'
          git push
